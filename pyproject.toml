[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-llm-survey"
version = "0.1.0"
description = "Tiny & super-tiny LLM survey: latency vs performance and catastrophic forgetting"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.46.0",
    "accelerate>=0.34.0",
    "datasets>=3.0.0",
    "peft>=0.13.0",
    "lm-eval>=0.4.7",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0"
]

[project.optional-dependencies]
rwkv = ["rwkv>=0.8.0"]
dev = ["ruff>=0.6.0"]

[project.scripts]
tls-mmlu = "tiny_llm_survey.cli:run_mmlu"
tls-baseline = "tiny_llm_survey.cli:run_baseline"
tls-latency = "tiny_llm_survey.cli:run_latency"
tls-train = "tiny_llm_survey.cli:run_train"
tls-forgetting = "tiny_llm_survey.cli:run_forgetting"
tls-sequential = "tiny_llm_survey.cli:run_sequential"
tls-forgetting-curves = "tiny_llm_survey.cli:run_forgetting_curves"
tls-aggregate = "tiny_llm_survey.cli:run_aggregate"
tls-visualize = "tiny_llm_survey.cli:run_visualize"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]